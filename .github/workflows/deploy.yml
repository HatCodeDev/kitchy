name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Kitchy API
    runs-on: [self-hosted, kitchy]

    steps:
      - name: Pull latest changes
        run: |
          cd /home/vonlunant/services/kitchy
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart API container
        run: |
          cd /home/vonlunant/services/kitchy
          docker compose --env-file .env -f /etc/vonluna/kitchy-compose.yml up -d --no-deps --build api

      - name: Run database migrations
        run: |
          cd /home/vonlunant/services/kitchy
          docker compose --env-file .env -f /etc/vonluna/kitchy-compose.yml exec -T api alembic upgrade head
